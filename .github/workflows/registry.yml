name: Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  git-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check port git trees
        run: python3 scripts/check-git-trees.py
